<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice Bridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root {
    --ink: #0d1014;
    --panel: #151a20;
    --line: #232b34;
    --text: #e7ecf1;
    --muted: #78848f;
    --dim: #4c5761;
    --live: #47d18b;
    --warn: #e8664a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: "Segoe UI", "Nirmala UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 8px 10px; gap: 6px;
  }

  .bar { display: flex; align-items: center; gap: 10px; }

  .micwrap { position: relative; display: grid; place-items: center; flex: none; }
  #toggle {
    position: relative; z-index: 1;
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .18s, color .18s, transform .12s;
  }
  #toggle:hover { border-color: #35424f; }
  #toggle:active { transform: scale(.95); }
  #toggle:focus-visible { outline: 2px solid var(--live); outline-offset: 3px; }
  #toggle svg { width: 20px; height: 20px; }
  body.live #toggle { color: var(--live); border-color: var(--live); }
  body.error #toggle { color: var(--warn); border-color: var(--warn); }

  .ring {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--live); opacity: 0; pointer-events: none;
  }
  body.live .ring { animation: pulse 1.9s ease-out infinite; }
  @keyframes pulse {
    from { transform: scale(1); opacity: .5; }
    to   { transform: scale(1.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { body.live .ring { animation: none; } }

  .langs { display: flex; gap: 5px; flex: 1; }
  .lang {
    font-family: inherit; font-size: 12px; padding: 5px 11px; border-radius: 999px;
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    cursor: pointer; white-space: nowrap;
  }
  .lang[aria-pressed="true"] { color: var(--text); border-color: #3d4a57; background: var(--panel); }
  .lang:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

  #info {
    flex: none; width: 22px; height: 22px; border-radius: 6px;
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    cursor: pointer; font-size: 12px; line-height: 1; padding: 0;
    display: grid; place-items: center;
  }
  #info:hover { color: var(--muted); border-color: #35424f; }
  #info[aria-pressed="true"] { color: var(--text); background: var(--panel); }
  #info:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

  #target {
    font-size: 11px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 4px 7px; border: 1px solid var(--line); border-radius: 5px;
  }
  #target.bad { color: var(--warn); border-color: rgba(232,102,74,.4); }
  #target[hidden] { display: none; }
</style>
</head>
<body>

<div class="bar">
  <div class="micwrap">
    <span class="ring"></span>
    <button id="toggle" aria-pressed="false" aria-label="Start dictation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v4"/>
      </svg>
    </button>
  </div>
  <div class="langs" id="langs"></div>
  <button id="info" type="button" aria-pressed="false" title="Show where text is being typed">i</button>
</div>

<div id="target" hidden>Waiting for a target window</div>

<script>
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var body = document.body;
  var toggleBtn = document.getElementById("toggle");
  var langsEl = document.getElementById("langs");
  var targetEl = document.getElementById("target");
  var infoBtn = document.getElementById("info");

  var config = {
    defaultLang: "bn-BD", altLang: "en-US", typeInterim: false,
    hotkeyToggle: "ctrl+alt+m", hotkeyLang: "ctrl+alt+l", target: ""
  };
  var rec = null;
  var listening = false;
  var lang = config.defaultLang;
  var restartTimer = null;

  function label(code) {
    if (code.indexOf("bn") === 0) return "বাংলা";
    if (code.indexOf("en") === 0) return "EN";
    return code;
  }

  function prettyKeys(spec) {
    return spec.split("+").map(function (p) {
      p = p.trim();
      return p.charAt(0).toUpperCase() + p.slice(1);
    }).join(" ");
  }

  // The mic is the only status light: grey idle, green live, red problem.
  // The reason for red always sits in the tooltip and in the target line.
  //
  // A problem that does not go away on its own, a hotkey another app already
  // owns above all, is kept as a sticky warning. Without that it was wiped by
  // the first successful phrase and the mic went quietly grey again while the
  // hotkey was still dead.
  var stickyWarning = "";
  var lastTargetText = "Waiting for a target window";

  function setError(text) {
    body.classList.add("error");
    toggleBtn.title = text;
    showTarget(text, true);
  }

  function setStickyWarning(text) {
    stickyWarning = text;
    setError(text);
  }

  function clearError() {
    if (stickyWarning) { setError(stickyWarning); return; }
    body.classList.remove("error");
    showTarget(lastTargetText, false);
    refreshMicTitle();
  }

  function refreshMicTitle() {
    // Never overwrite the reason the mic is red.
    if (body.classList.contains("error")) return;
    toggleBtn.title = (listening ? "Listening in " + lang : "Start dictation")
      + "  (" + prettyKeys(config.hotkeyToggle) + ")";
  }

  function showTarget(text, bad) {
    targetEl.textContent = text;
    targetEl.title = text;          // the line is narrow, so keep the full text
    targetEl.classList.toggle("bad", !!bad);
  }

  function showTargetApp(text) {
    lastTargetText = text;
    if (!body.classList.contains("error")) showTarget(text, false);
  }

  // The "typing into ..." line is optional. The window is small enough either
  // way, so nothing is resized and you keep whatever size you drag it to.
  function applyInfo(on) {
    targetEl.hidden = !on;
    infoBtn.setAttribute("aria-pressed", String(on));
    try { localStorage.setItem("vb.showTarget", on ? "1" : "0"); } catch (e) {}
  }

  infoBtn.addEventListener("click", function () {
    applyInfo(infoBtn.getAttribute("aria-pressed") !== "true");
  });

  var savedInfo = "0";
  try { savedInfo = localStorage.getItem("vb.showTarget") || "0"; } catch (e) {}
  applyInfo(savedInfo === "1");

  if (!SR) {
    setError("This browser has no speech engine. Use Chrome or Edge.");
    toggleBtn.disabled = true;
    return;
  }

  function post(path, payload) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).catch(function () {});
  }

  // Sending what was heard.
  //
  // Google sends a fresh interim result several times a second. Queueing every
  // one of them behind the last made the typing fall further and further
  // behind on a long sentence until it looked frozen, so only the newest
  // interim is ever waiting to go out. Final results are never dropped.
  var pendingFinals = [];
  var pendingInterim = null;
  var sending = false;
  var lastSentAt = 0;
  var pumpTimer = null;
  var INTERIM_MIN_GAP_MS = 220;

  // itsLang is the language the recognizer was listening in, not whatever is
  // selected now. Switching language mid phrase used to finish the Bangla
  // sentence with an English full stop.
  function queueText(text, isFinal, itsLang) {
    var job = { text: text, lang: itsLang };
    if (isFinal) {
      pendingFinals.push(job);
      pendingInterim = null;        // the final says it better
    } else {
      pendingInterim = job;
    }
    pump();
  }

  function pump() {
    if (sending) return;
    var job;
    if (pendingFinals.length) {
      job = pendingFinals.shift();
      job.final = true;
    } else if (pendingInterim !== null) {
      var wait = INTERIM_MIN_GAP_MS - (Date.now() - lastSentAt);
      if (wait > 0) {
        clearTimeout(pumpTimer);
        pumpTimer = setTimeout(pump, wait);
        return;
      }
      job = pendingInterim;
      job.final = false;
      pendingInterim = null;
    } else {
      return;
    }

    sending = true;
    fetch("/text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: job.text, final: job.final, lang: job.lang || lang })
    }).then(function (r) {
      if (!r.ok) throw new Error("Voice Bridge server error " + r.status);
      return r.json();
    }).then(onTyped)
      .catch(function (err) { setError(err.message || "Cannot reach Voice Bridge"); })
      .then(function () {
        sending = false;
        lastSentAt = Date.now();
        pump();
      });
  }

  function onTyped(res) {
    if (!res) return;
    if (res.result === "blocked" || res.result === "error") {
      setError(res.message || "Typing blocked");
    } else if (res.message) {
      lastTargetText = "Typing into  " + res.message;
      clearError();
    }
  }

  function renderLangs() {
    langsEl.innerHTML = "";
    [config.defaultLang, config.altLang].forEach(function (code) {
      var b = document.createElement("button");
      b.className = "lang";
      b.type = "button";
      b.textContent = label(code);
      b.title = code;
      b.setAttribute("aria-pressed", String(code === lang));
      b.addEventListener("click", function () { setLang(code); });
      langsEl.appendChild(b);
    });
  }

  function setLang(code) {
    if (code === lang) return;
    lang = code;
    renderLangs();
    refreshMicTitle();
    if (listening) { stop(); setTimeout(start, 180); }
  }

  // Every recognizer gets a number. Chrome keeps delivering events from an
  // engine after it has been replaced, and acting on those would restart the
  // wrong one, so stale engines are ignored.
  var generation = 0;
  var restartFails = 0;
  var lastEngineEvent = 0;
  var watchdogTimer = null;
  var ENGINE_STALL_MS = 12000;

  function engineAlive() { lastEngineEvent = Date.now(); }

  function buildRecognizer() {
    var mine = ++generation;
    var itsLang = lang;
    var r = new SR();
    r.lang = itsLang;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = function () {
      if (mine !== generation) return;
      engineAlive();
      restartFails = 0;
      body.classList.add("live");
      toggleBtn.setAttribute("aria-pressed", "true");
      toggleBtn.setAttribute("aria-label", "Stop dictation");
      clearError();
    };

    r.onaudiostart = engineAlive;
    r.onspeechstart = engineAlive;

    r.onresult = function (e) {
      engineAlive();
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var result = e.results[i];
        var text = result[0].transcript;
        if (result.isFinal) {
          queueText(text, true, itsLang);
        } else if (config.typeInterim) {
          queueText(text, false, itsLang);
        }
      }
    };

    r.onerror = function (e) {
      engineAlive();
      if (mine !== generation) return;
      if (e.error === "no-speech" || e.error === "aborted") return;
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        listening = false;
        stopWatchdog();
        paintStopped();
        setError("Microphone blocked. Allow it for this page, then reload.");
        return;
      }
      setError("Speech engine error: " + e.error);
    };

    r.onend = function () {
      engineAlive();
      if (mine !== generation) return;
      // Chrome ends the session after a pause. Restart it so dictation feels
      // continuous, the same way the Voice In extension does.
      if (!listening) { paintStopped(); return; }
      scheduleRestart(250);
    };

    return r;
  }

  function replaceRecognizer() {
    try { rec.abort(); } catch (err) {}
    rec = buildRecognizer();
    try {
      rec.start();
      return true;
    } catch (err) {
      return false;
    }
  }

  function scheduleRestart(delay) {
    clearTimeout(restartTimer);
    restartTimer = setTimeout(function () {
      if (!listening) return;
      try {
        rec.start();
        restartFails = 0;
      } catch (err) {
        // Silently swallowing this is what used to leave the mic green with
        // nothing being typed. A wedged engine never recovers, so after a
        // couple of failures throw it away and build a new one.
        restartFails++;
        if (restartFails >= 2 && replaceRecognizer()) {
          restartFails = 0;
          return;
        }
        scheduleRestart(300 * restartFails);
      }
    }, delay);
  }

  function startWatchdog() {
    stopWatchdog();
    engineAlive();
    watchdogTimer = setInterval(function () {
      if (!listening) return;
      if (Date.now() - lastEngineEvent < ENGINE_STALL_MS) return;
      // Chrome sometimes goes quiet without ever ending the session. Rebuild
      // rather than sit there looking like everything is fine.
      engineAlive();
      if (!replaceRecognizer()) scheduleRestart(400);
    }, 3000);
  }

  function stopWatchdog() {
    clearInterval(watchdogTimer);
    watchdogTimer = null;
  }

  function paintStopped() {
    body.classList.remove("live");
    toggleBtn.setAttribute("aria-pressed", "false");
    toggleBtn.setAttribute("aria-label", "Start dictation");
    refreshMicTitle();
  }

  function start() {
    if (listening) return;
    listening = true;
    rec = buildRecognizer();
    try {
      rec.start();
    } catch (err) {
      listening = false;
      setError("Could not start: " + err.message);
      return;
    }
    startWatchdog();
    post("/state", { listening: true, lang: lang });
  }

  function stop() {
    if (!listening) return;
    listening = false;
    clearTimeout(restartTimer);
    stopWatchdog();
    // Anything still queued is stale, but a final that Chrome has not handed
    // over yet is still coming and must be allowed through.
    pendingInterim = null;
    try { rec.stop(); } catch (err) {}
    paintStopped();
    post("/state", { listening: false, lang: lang });
  }

  toggleBtn.addEventListener("click", function () {
    listening ? stop() : start();
  });

  // Commands pushed from the Python side when a global hotkey fires.
  var events = new EventSource("/events");
  events.onmessage = function (e) {
    var msg = JSON.parse(e.data);
    if (msg.cmd === "toggle") { listening ? stop() : start(); }
    if (msg.cmd === "lang") { setLang(lang === config.defaultLang ? config.altLang : config.defaultLang); }
    if (msg.cmd === "target") { showTargetApp("Typing into  " + msg.title); }
    if (msg.cmd === "warn") { setStickyWarning(msg.message); }
  };

  fetch("/config")
    .then(function (r) { return r.json(); })
    .then(function (c) {
      config = c;
      lang = c.defaultLang;
      renderLangs();
      refreshMicTitle();
      if (c.target) showTargetApp("Typing into  " + c.target);
      // A hotkey another app already owns is the one failure you cannot see
      // any other way, so it turns the mic red and stays there.
      if (c.warnings && c.warnings.length) setStickyWarning(c.warnings.join("  "));
    })
    .catch(function () { renderLangs(); refreshMicTitle(); });
})();
</script>
</body>
</html>
